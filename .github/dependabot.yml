# Netwise dependency updates.
#
# WHY THIS MATTERS HERE SPECIFICALLY
#   This is a security tool. A vulnerable dependency in something that reads
#   firewall configurations is worse than the same vulnerability elsewhere,
#   because of what it is trusted to look at.
#
#   243 packages are installed in a working environment. Nobody is tracking
#   advisories for those by hand, and pretending otherwise is the same class
#   of claim this project keeps refusing to make.
#
# WEEKLY, NOT DAILY
#   A daily cadence on a four-person student team produces noise that gets
#   ignored, and an ignored security alert is worse than none -- it looks
#   like coverage. Weekly is small enough to actually read.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # GROUPED, and the first weekly run is why.
    #
    # The original config grouped only the dev tools. Every RUNTIME dependency
    # got its own pull request, so one Monday produced eight PRs -- five pip,
    # three actions -- in the same week the team was clearing a fifteen-PR
    # queue. The comment above warns that a daily cadence "produces noise that
    # gets ignored, and an ignored security alert is worse than none". Weekly
    # at eight arrives at the same place by a different route.
    #
    # Grouping does not reduce coverage. Dependabot still tracks every package
    # and still opens a SEPARATE PR for anything with a security advisory,
    # which is the case that must never be batched behind a routine bump.
    groups:
      runtime:
        patterns: ["*"]
        exclude-patterns: ["pytest*", "ruff*", "playwright*"]
      dev-and-tooling:
        patterns: ["pytest*", "ruff*", "playwright*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    # Same reasoning: three separate PRs to bump three actions in one file is
    # three review slots for one decision.
    groups:
      actions:
        patterns: ["*"]

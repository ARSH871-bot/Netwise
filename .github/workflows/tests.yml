# Netwise -- run the test suite on every pull request.
#
# WHY THIS IS WORTH HAVING
#   Every verification in this project used to be done by hand. That is how the
#   duplicate-`id` defect survived days in the code and a code review: it was
#   only found when someone built a dashboard and looked at real data. The test
#   that covers it now exists, but a test nobody runs is a test that does not
#   protect anyone.
#
# WHAT IT RUNS
#   pytest tests/ -- the whole suite. It needs NEITHER Batfish NOR Ollama,
#   which is what makes this cheap enough to run on every push. Keeping the
#   suite free of those dependencies is worth protecting; if a test ever needs
#   a live service, put it behind a separate, manually-triggered workflow
#   rather than slowing this one down.
#
# WHAT IT DOES NOT DO
#   It cannot BLOCK a merge. Required status checks need branch protection,
#   which needs GitHub Pro or a public repo, and we are deliberately private so
#   client configs stay protected (see CONTRIBUTING.md section 6). So a red
#   cross here is a signal, not a gate -- the same standing as our branching
#   convention. Please treat it as one.

name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    strategy:
      # Do not cancel the 3.13 job because 3.12 failed -- when a failure is
      # version-specific, seeing both results is the whole point.
      fail-fast: false
      matrix:
        # The versions the team actually uses. Samika is on 3.12, Arsh on 3.13.
        # A dependency that breaks on one and not the other is exactly the kind
        # of problem that wastes an afternoon before anyone suspects Python.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        # tests/test_chat_rendering.py drives the real web/static/app.js through
        # a small Node DOM shim, and SKIPS itself if `node` is missing. The
        # ubuntu-latest image happens to ship Node today, so those tests were
        # already running -- but "happens to" is not a guarantee, and a skipped
        # test is indistinguishable from a passing one in the summary line.
        # Since they are what stops a refusal rendering as a confident answer,
        # depending on an incidental property of the runner image is the wrong
        # trade. This makes it explicit.
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # Cache pip downloads between runs. pybatfish and its dependencies
          # are the slow part of the install, and they rarely change.
          cache: pip

      - name: Install dependencies
        # Installing the full requirements.txt rather than just pytest is
        # deliberate: it means CI also proves that a clean machine can install
        # this project from the file we tell people to use. A broken
        # requirements.txt is a real failure and should be caught here.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        # BOTH the version and the rule set are pinned, deliberately.
        #
        # The first version of this step ran a bare `pip install ruff` and a
        # bare `ruff check`, relying on "ruff's default rule set". That was
        # clean on the author's machine (0.14.14) and produced 207 errors on
        # 0.16.2 -- Ankeet installed fresh and found it on #84. The gate would
        # have arrived red, and a lint gate that is red on arrival teaches
        # everyone to ignore it.
        #
        # Same shape as the #74 finding: a guarantee ("ruff clean") that held
        # against an unstated condition -- whichever ruff happened to be
        # installed that day -- rather than anything the repo enforces.
        #
        # --select makes the intent explicit rather than inherited, and the pin
        # stops a new release widening it underneath us. Widening the set is a
        # deliberate change with its own PR, not something that arrives on a
        # Tuesday.
        run: |
          python -m pip install "ruff==0.14.14"
          ruff check --select E4,E7,E9,F analysis/ ai/ web/ tools/ tests/

      - name: Run tests
        run: pytest tests/ -v

      - name: Check the package imports on a clean machine
        # Catches a missing dependency that the tests happen not to exercise.
        # `web.main` in particular pulls in fastapi and python-multipart, which
        # nothing in tests/ imports directly.
        run: python -c "import analysis.pipeline, ai.explain, web.main; print('imports OK')"

! Synthetic fixture: routing-faults -- see rtr-a.cfg for the four faults.
hostname rtr-c
!
! FAULT 1: the same address as rtr-a's Loopback0.
interface Loopback0
 ip address 10.255.0.1 255.255.255.255
!
interface GigabitEthernet0/0
 description to rtr-a
 ip address 10.0.13.2 255.255.255.252
!
! FAULT 4: rtr-a puts this link in area 0.
router ospf 1
 network 10.0.13.0 0.0.0.3 area 1
!
end

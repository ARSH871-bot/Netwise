! Synthetic fixture: routing-faults. Invented, describes nobody's network.
! Four DELIBERATE FAULTS across three routers, each a fact Batfish can find
! with no policy at all:
!   1. rtr-c's Loopback0 reuses rtr-a's address 10.255.0.1   (duplicate IP)
!   2. rtr-a and rtr-b each send 192.0.2.0/24 to the other   (forwarding loop)
!   3. rtr-b is AS 65003, but rtr-a expects 65002            (BGP mismatch)
!   4. rtr-a puts 10.0.13.0/30 in OSPF area 0, rtr-c area 1  (OSPF mismatch)
hostname rtr-a
!
interface Loopback0
 ip address 10.255.0.1 255.255.255.255
!
interface GigabitEthernet0/0
 description to rtr-b
 ip address 10.0.12.1 255.255.255.252
!
interface GigabitEthernet0/1
 description to rtr-c
 ip address 10.0.13.1 255.255.255.252
!
router ospf 1
 network 10.0.13.0 0.0.0.3 area 0
!
router bgp 65001
 neighbor 10.0.12.2 remote-as 65002
!
! FAULT 2 (half): 192.0.2.0/24 via rtr-b
ip route 192.0.2.0 255.255.255.0 10.0.12.2
!
end

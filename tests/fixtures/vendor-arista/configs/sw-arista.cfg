! Netwise test fixture -- Arista EOS.
!
! DELIBERATE FAULT: the second ACL rule can never fire. The permit above it
! already matches everything it would match, so the deny is dead -- traffic
! somebody intended to block is allowed. filterLineReachability finds this.
!
hostname sw-arista
!
interface Ethernet1
   description internal
   ip address 10.30.0.1/24
   ip access-group GUEST_IN in
!
ip access-list GUEST_IN
   10 permit ip 10.30.0.0/24 any
   20 deny tcp 10.30.0.0/24 host 10.99.0.7 eq 445
!
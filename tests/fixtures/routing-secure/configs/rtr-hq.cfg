!
! Netwise test fixture -- SYNTHETIC. Not a real network.
!
! Two-router topology for the routing check. rtr-hq's LAN and rtr-branch's LAN
! must reach each other over the WAN link between them. This fixture has both
! static routes in place, used to prove the routing check reports status="none"
! when reachability genuinely works.
!
hostname rtr-hq
!
interface GigabitEthernet0/0
 ip address 10.10.10.1 255.255.255.0
!
interface GigabitEthernet0/1
 ip address 10.1.1.1 255.255.255.252
!
ip route 10.20.20.0 255.255.255.0 10.1.1.2
!

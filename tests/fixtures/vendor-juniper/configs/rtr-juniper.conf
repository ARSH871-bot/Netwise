# Netwise test fixture -- Juniper JunOS.
#
# DELIBERATE FAULT: the "block-smb" term can never match. The "allow-all" term
# above it accepts everything first, so the block is dead -- traffic somebody
# intended to deny is accepted. filterLineReachability finds this.
#
system {
    host-name rtr-juniper;
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                filter {
                    input BRANCH_IN;
                }
                address 10.50.0.1/24;
            }
        }
    }
}
firewall {
    family inet {
        filter BRANCH_IN {
            term allow-all {
                then accept;
            }
            term block-smb {
                from {
                    destination-port 445;
                    protocol tcp;
                }
                then discard;
            }
        }
    }
}
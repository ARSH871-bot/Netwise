!
! Netwise test fixture -- SYNTHETIC. Not a real network.
!
! The SAME router as rtr-us5-secure, but with a classic misconfiguration: the
! specific HTTPS rule has been replaced with a blanket "permit ip any any".
! Someone probably added it to fix a connectivity complaint and never removed
! it. It silently allows everything.
!
! Used to prove the access-control check reports status="found" when policy is
! violated. Keep the 
!
! SOFTWARE VERSION (#239). 15.2 is a real IOS train with real published
! advisories, so the CVE check has something genuine to match. This is the
! deliberately-insecure fixture, so it carries the version that produces
! status="found" -- outdated software beside a misconfigured ACL.
!
version 15.2
!
hostname and ACL name identical to the secure fixture so
! the same policy assertions run against both.
!
hostname rtr-us5
!
interface GigabitEthernet0/0
 ip address 10.10.10.1 255.255.255.0
 ip access-group acl_in in
!
ip access-list extended acl_in
 permit udp 10.10.10.0 0.0.0.255 host 218.8.104.58 eq domain
 permit ip any any
!

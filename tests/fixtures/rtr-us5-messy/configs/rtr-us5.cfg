!
! Netwise test fixture -- SYNTHETIC. Not a real network.
!
! The same router as rtr-us5-secure, after someone "fixed" a problem badly.
! It contains three separate faults, one for each new access-control analysis:
!
!   1. A blanket deny was added at the TOP of acl_in, so the two permit rules
!      below it can never match. They are dead rules -- the config looks like
!      it allows DNS and HTTPS, but nothing gets through.
!      -> filterLineReachability finds these.
!
!   2. GigabitEthernet0/1 applies an ACL called acl_guest_in that is never
!      defined anywhere. On a real Cisco device an undefined ACL reference
!      behaves very differently from what the author intended.
!      -> undefinedReferences finds this.
!
!   3. Because line 1 denies the whole subnet, the DNS policy statement that
!      should PERMIT is now denied.
!      -> testFilters finds this.
!
! SOFTWARE VERSION (#239). 12.2 is a real but very old IOS train, and it is
! deliberately NOT in our dataset. That produces status="error" -- "we have
! no CVE data for this version" -- which is the case AC-2 exists for. An
! unmatched version must never render as a clean bill of health, and this
! fixture is what proves it does not.
!
version 12.2
!
hostname rtr-us5
!
interface GigabitEthernet0/0
 ip address 10.10.10.1 255.255.255.0
 ip access-group acl_in in
!
interface GigabitEthernet0/1
 ip address 10.30.0.1 255.255.255.0
 ip access-group acl_guest_in in
!
ip access-list extended acl_in
 deny   ip 10.10.10.0 0.0.0.255 any
 permit udp 10.10.10.0 0.0.0.255 host 218.8.104.58 eq domain
 permit tcp 10.10.10.0 0.0.0.255 host 10.20.0.5 eq 443
 deny   ip any any
!

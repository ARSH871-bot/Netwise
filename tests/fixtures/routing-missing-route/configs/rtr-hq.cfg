!
! Netwise test fixture -- SYNTHETIC. Not a real network.
!
! Same topology as routing-secure, but the static route from rtr-hq to
! rtr-branch's LAN was never added -- the classic "we stood up a new branch
! and forgot the route on the HQ side" mistake. rtr-branch's route BACK to
! HQ is still present, so this is a one-directional break, not a total one.
! Used to prove the routing check reports status="found" when a route is
! genuinely missing, not merely denied by policy.
!
hostname rtr-hq
!
interface GigabitEthernet0/0
 ip address 10.10.10.1 255.255.255.0
!
interface GigabitEthernet0/1
 ip address 10.1.1.1 255.255.255.252
!

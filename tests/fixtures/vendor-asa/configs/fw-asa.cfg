! Netwise test fixture -- Cisco ASA.
!
! WHY THIS FIXTURE EXISTS (#217)
!   Batfish reports this file as PARTIALLY_UNRECOGNIZED: it understands the
!   interfaces and the access-list, and does NOT understand some of the ASA
!   specific lines below. It still builds a node.
!
!   Before #217 the whole analysis was thrown away for that, and the user was
!   told nothing could be checked -- about a file we could largely read.
!
! DELIBERATE FAULT: the second ACL rule can never fire. The permit above it
! already matches everything it would match, so the deny is dead -- traffic
! somebody intended to block is allowed.
!
hostname fw-asa
!
interface GigabitEthernet0/0
 nameif outside
 security-level 0
 ip address 203.0.113.1 255.255.255.0
!
interface GigabitEthernet0/1
 nameif inside
 security-level 100
 ip address 10.60.0.1 255.255.255.0
!
access-list OUTSIDE_IN extended permit ip any any
access-list OUTSIDE_IN extended deny tcp any host 10.60.0.9 eq 3389
access-group OUTSIDE_IN in interface outside
!
! These are the lines Batfish does not fully recognise.
threat-detection basic-threat
threat-detection statistics access-list
class-map inspection_default
 match default-inspection-traffic
!
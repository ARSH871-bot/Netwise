This file is deliberately not a network configuration.

Netwise test fixture -- SYNTHETIC. Used to prove the pipeline reports
status="error" (not status="none") when Batfish cannot understand a config.

That distinction is the whole point of F-4: "we checked and found nothing" and
"we could not check" must never look the same to a user.

%%% not valid Cisco IOS %%%
interface !!! broken
  ip address not-an-address

!
! ===========================================================================
!  NETWISE SAMPLE NETWORK -- NOT A REAL DEVICE, NOT YOUR DATA
! ===========================================================================
!
!  This file is invented. It describes no real network, and no part of it
!  came from anybody's firewall. It exists so that somebody evaluating
!  Netwise can see what the tool does before they have to supply a
!  configuration of their own (US-56, #347).
!
!  The findings you will see after scanning it are REAL: Netwise loads this
!  file into Batfish and analyses it exactly as it would analyse yours.
!  Nothing about the result is pre-written. What is invented is the network,
!  not the analysis -- which is the whole distinction #352 was fixed for.
!
!  It carries three deliberate faults, so the scan has something to find:
!
!    1. A blanket "permit ip any any" at the end of acl_in. Somebody added
!       it to fix a connectivity complaint and never removed it. It silently
!       allows everything, defeating every rule written above it.
!
!    2. Because of (1), traffic that policy says must be denied -- including
!       a forged source address claiming to come from inside -- is permitted.
!
!    3. An outdated software train (15.2), which is real and carries real
!       published advisories.
!
!  THE HOSTNAME IS NOT COSMETIC. It must stay `rtr-us5`.
!
!  Two of the three checks still assert Netwise's built-in example policy,
!  which names that device (#87 -- the project's largest known gap, measured
!  in the group report section 10.3). Rename this host and the scan stops
!  finding anything. Measured, not guessed, while writing this file:
!
!      hostname sample-edge-rtr  ->  0 findings, 3 "could not check"
!      hostname rtr-us5          ->  5 findings, 1 "could not check"
!
!  So the sample is named for the policy that can actually check it. When
!  #353 and #355 land and every check reads a user-supplied policy, this
!  file can take a friendlier name and should.
!
!  Delete nothing here expecting the scan to still demonstrate the product.
!  tests/test_sample_network.py pins that this file still produces findings,
!  so a change that quietly made the sample clean would fail rather than
!  ship a demonstration of nothing.
!
! ===========================================================================
!
version 15.2
!
hostname rtr-us5
!
interface GigabitEthernet0/0
 description Office LAN
 ip address 10.10.10.1 255.255.255.0
 ip access-group acl_in in
!
ip access-list extended acl_in
 permit udp 10.10.10.0 0.0.0.255 host 218.8.104.58 eq domain
 permit ip any any
!

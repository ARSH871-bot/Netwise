!
! Netwise test fixture -- SYNTHETIC. Not a real network.
!
! A small, well-configured router: it may look up DNS on one approved server
! and reach one internal server over HTTPS. Everything else is denied.
! Used to prove the access-control check reports status="none" when a config
! is clean.
!
! SOFTWARE VERSION (#239). 15.9 is a real, much later IOS train. Our CVE
! dataset has ASSESSED it and recorded no advisories, which is what makes
! status="none" reachable at all -- see the dataset's `assessed` list.
! "We looked and found nothing" is a different claim from "we have no
! data", and only an assessed train may make the first one.
!
version 15.9
!
hostname rtr-us5
!
interface GigabitEthernet0/0
 ip address 10.10.10.1 255.255.255.0
 ip access-group acl_in in
!
ip access-list extended acl_in
 permit udp 10.10.10.0 0.0.0.255 host 218.8.104.58 eq domain
 permit tcp 10.10.10.0 0.0.0.255 host 10.20.0.5 eq 443
 deny   ip any any
!
